<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#171914">
  <title>나만의 공간 — 김명준</title>
  <meta name="robots" content="noindex,nofollow">
  <meta name="csrf-token" th:content="${csrfToken}">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/fonts/pretendard.css">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="private-page">
  <main class="private-shell">
    <header class="private-head">
      <div>
        <p class="section-index">AUTHENTICATED · PRIVATE</p>
        <h1><span th:text="${displayName}">샘플 사용자</span>님의<br>나만의 공간</h1>
      </div>
      <div class="private-actions">
        <a href="/">공개 소개 보기 ↗</a>
        <button class="button button--outline" id="logout-button" type="button">로그아웃</button>
      </div>
    </header>
    <p class="synthetic-banner">아래 내용은 기능 확인을 위해 만들어 넣은 합성 데이터이며 실제 개인정보가 아닙니다.</p>
    <section class="passkey-manager" aria-labelledby="passkey-manager-title">
      <div>
        <p class="section-index">RECOVERY · PASSKEYS</p>
        <h2 id="passkey-manager-title">내 패스키</h2>
        <p>기기를 잃기 전에 다른 기기나 보안 키에 패스키를 하나 더 등록하세요.</p>
      </div>
      <form id="add-passkey-form" class="add-passkey-form">
        <label>
          <span>새 패스키 이름</span>
          <input name="nickname" maxlength="40" required value="예비 기기 패스키">
        </label>
        <button class="button" type="submit">패스키 추가</button>
      </form>
      <div class="passkey-list" id="passkey-list">
        <article class="passkey-row" th:each="passkey : ${passkeys}">
          <div>
            <strong th:text="${passkey.nickname}">이 기기의 패스키</strong>
            <time th:datetime="${passkey.registeredAt}" th:text="${#temporals.format(passkey.registeredAt, 'yyyy-MM-dd')}">2026-09-07</time>
            <span class="passkey-storage" th:classappend="${passkey.synced} ? 'passkey-storage--synced' : 'passkey-storage--device'" th:text="${passkey.storageLabel}">이 기기 전용</span>
          </div>
          <button class="passkey-delete" type="button" th:attr="data-passkey-id=${passkey.id}">삭제</button>
        </article>
      </div>
      <p class="passkey-warning">마지막 패스키는 삭제할 수 없습니다. 모든 기기를 잃으면 비밀번호나 이메일로 복구할 수 없습니다.</p>
      <p id="passkey-manager-status" class="manager-status" role="status" aria-live="polite"></p>
    </section>
    <section class="private-grid" aria-label="비공개 항목">
      <article class="private-item" th:each="item, itemStat : ${items}">
        <span th:text="${#numbers.formatInteger(itemStat.count, 2)}">01</span>
        <h2 th:text="${item.title}">합성 항목</h2>
        <p th:text="${item.body}">합성 설명</p>
      </article>
    </section>
  </main>
  <script src="/session.js" defer></script>
  <script src="/manage-passkeys.js" defer></script>
</body>
</html>
