server.forward-headers-strategy=native
server.port=${PORT:8080}
server.servlet.session.cookie.secure=true
# Reserve the TCP socket before DB/JPA initialization, then serve only after startup.
t08.server.bind-on-init=true

# Production must fail fast instead of silently falling back to localhost/H2.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:3}
spring.datasource.hikari.minimum-idle=0

t08.webauthn.rp-id=${T08_WEBAUTHN_RP_ID}
t08.webauthn.origin=${T08_WEBAUTHN_ORIGIN}
