spring.application.name=t08-passkey-portfolio

# Local development uses an in-memory database. Production overrides these with
# SPRING_DATASOURCE_* environment variables; no credentials live in this file.
spring.datasource.url=jdbc:h2:mem:t08;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.enabled=false
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
spring.session.jdbc.initialize-schema=never

# WebAuthn relying party. The origin must match the browser address exactly, and
# must be https in production. localhost is the only permitted http exception.
t08.webauthn.rp-id=localhost
t08.webauthn.rp-name=Myeongjun Kim
t08.webauthn.origin=http://localhost:8080
t08.webauthn.timeout=5m
